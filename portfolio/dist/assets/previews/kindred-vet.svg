<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 290" role="img" aria-labelledby="kv-title kv-desc">
  <title id="kv-title">Kindred Vet — visit preparation portal illustration</title>
  <desc id="kv-desc">A code-drawn brand and interface illustration showing a compact care index, pet species choices, a visit-reason panel and preparation guidance. A small dog motif sits in the sidebar. This is not a product screenshot.</desc>
  <rect width="560" height="290" fill="#f3f4ee"/>
  <rect width="96" height="290" fill="#fffdf8"/>
  <path d="M96 0v290" stroke="#c0d6da"/>
  <g fill="#294b4c" font-family="Arial,sans-serif">
