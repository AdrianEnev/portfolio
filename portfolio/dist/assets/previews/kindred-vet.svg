    <text x="277.5" y="162" font-size="7" text-anchor="middle">Rabbit</text><text x="339.5" y="162" font-size="6.2" text-anchor="middle">Another friend</text>
    <text x="128" y="190" font-size="7" font-weight="700" letter-spacing=".8">02 / WHAT WOULD YOU LIKE HELP WITH?</text>
    <rect x="127" y="199" width="113" height="23" rx="7" fill="#f3f4ee" stroke="#87aeb9"/>
    <rect x="247" y="199" width="119" height="23" rx="7" fill="#f5f5ec" stroke="#d2dddd"/>
