    <text x="15" y="41" font-size="5.5" letter-spacing="1.1">CARE WITH HEART</text>
    <text x="16" y="79" font-size="6" letter-spacing="1.1" fill="#71909a">YOUR VISIT</text>
    <rect x="9" y="91" width="78" height="29" rx="8" fill="#f4dac4"/>
    <text x="16" y="109" font-size="8" font-weight="700">01   Prepare</text>
    <text x="16" y="140" font-size="8">02   Visit note</text>
    <text x="16" y="170" font-size="8">03   Our care</text>
    <text x="16" y="200" font-size="8">04   Questions</text>
  </g>
  <g transform="translate(24 226)">
