    <text x="113" y="76" font-size="8.5" fill="#5a7a84">Choose your pet. Gather the questions that matter.</text>
  </g>
  <rect x="112" y="92" width="270" height="172" rx="15" fill="#fffdf8" stroke="#bed3d5"/>
  <g font-family="Arial,sans-serif" fill="#294b4c">
    <text x="128" y="113" font-size="7" font-weight="700" letter-spacing=".8">01 / WHO’S COMING?</text>
    <rect x="127" y="124" width="53" height="45" rx="9" fill="#f4dac4" stroke="#bd7960"/>
    <rect x="189" y="124" width="53" height="45" rx="9" fill="#f5f5ec" stroke="#d2dddd"/>
    <rect x="251" y="124" width="53" height="45" rx="9" fill="#f5f5ec" stroke="#d2dddd"/>
    <rect x="313" y="124" width="53" height="45" rx="9" fill="#f5f5ec" stroke="#d2dddd"/>
