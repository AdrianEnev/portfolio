    <path d="M8 20C-1 17-2-1 7 1l10 12m20 0 9-12c9-2 10 16 1 20" fill="#9b7055"/>
    <path d="M10 16C10 0 38 0 38 16v18c-2 13-25 13-28 0Z" fill="#d8a877"/>
    <path d="M16 20q3-4 5 0m9 0q3-4 5 0" fill="none" stroke="#294b4c" stroke-width="1.5" stroke-linecap="round"/>
    <ellipse cx="25" cy="28" rx="9" ry="7" fill="#f9e6c9"/>
    <path d="m22 26 6 0-3 4zm3 4v3m-3 0q3 3 6 0" fill="#294b4c" stroke="#294b4c" stroke-width=".8"/>
  </g>
  <g font-family="Arial,sans-serif" fill="#294b4c">
    <text x="113" y="26" font-size="7" letter-spacing="1.2">VISIT PREPARATION / KINDRED VET</text>
