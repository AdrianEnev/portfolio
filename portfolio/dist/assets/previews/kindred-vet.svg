  </g>
  <rect x="393" y="92" width="145" height="172" rx="15" fill="#dfe9dc"/>
  <g font-family="Arial,sans-serif" fill="#294b4c">
    <text x="408" y="115" font-size="6.5" letter-spacing="1.1" fill="#627b69">HERE TO HELP</text>
    <text x="408" y="141" font-size="15" font-weight="700">Good questions.</text><text x="408" y="160" font-size="15" font-weight="700">A clearer visit.</text>
    <path d="M408 178h114" stroke="#b1c4ae"/>
    <text x="408" y="194" font-size="7.4">Bring your observations.</text><text x="408" y="208" font-size="7.4">Note medicines and routines.</text><text x="408" y="222" font-size="7.4">Keep questions together.</text>
    <text x="408" y="247" font-size="7.5" font-weight="700">Prepare a visit note ↗</text>
  </g>
  <text x="113" y="279" fill="#63858e" font-family="Arial,sans-serif" font-size="6.6" letter-spacing=".5">GUIDANCE  /  VISIT NOTE  /  CARE INFORMATION</text>
