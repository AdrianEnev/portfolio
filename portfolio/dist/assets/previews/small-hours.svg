    <text x="532" y="24" font-size="7.2" letter-spacing="1.1" text-anchor="end">OCTOBER 2026</text>
  </g>
  <path d="M28 36H532" stroke="#18181b" stroke-width="1.2"/>
  <text x="25" y="91" fill="#18181b" font-family="Impact,'Arial Narrow',Arial,sans-serif" font-size="61" font-weight="700" letter-spacing="1.2">SMALL <tspan fill="#df4937">HOURS</tspan></text>
  <path d="M28 104H532" stroke="#18181b" stroke-width="2"/>
  <rect x="28" y="111" width="165" height="33" fill="#18181b"/>
  <g font-family="Arial,sans-serif">
