<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 290" role="img" aria-labelledby="sh-title sh-desc">
  <title id="sh-title">Small Hours Theatre — programme-led playbill illustration</title>
  <desc id="sh-desc">A code-drawn theatre brand and interface illustration, with a bold cream, red and black masthead, a three-production date strip, a burgundy poster and selected-production notes. This is not a production screenshot.</desc>
  <rect width="560" height="290" fill="#f0ecdf"/>
