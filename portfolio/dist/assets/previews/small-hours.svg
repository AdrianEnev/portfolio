    <text x="326" y="194" font-size="20" font-weight="700" letter-spacing="-.6">The Quiet City</text>
    <text x="326" y="212" font-size="7.6">Two strangers. One final tram.</text>
    <text x="326" y="225" font-size="7.6">A conversation until morning.</text>
