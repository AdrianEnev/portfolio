      <text x="66" y="125" font-size="9" font-weight="700">The Quiet City</text><text x="66" y="137" font-size="5.8" letter-spacing=".7">OCT / 19:30</text>
    </g>
    <g fill="#18181b">
      <text x="207" y="131" font-size="17" font-weight="700" letter-spacing="-.6">11</text>
      <text x="236" y="125" font-size="9" font-weight="700">After the Rain</text><text x="236" y="137" font-size="5.8" letter-spacing=".7">OCT / 19:30</text>
      <text x="377" y="131" font-size="17" font-weight="700" letter-spacing="-.6">18</text>
      <text x="406" y="125" font-size="9" font-weight="700">Night Letters</text><text x="406" y="137" font-size="5.8" letter-spacing=".7">OCT / 20:00</text>
    </g>
    <path d="M362 116v23" stroke="#aaa69a"/>
  </g>
  <rect x="28" y="159" width="278" height="110" fill="#852e28"/>
  <path d="M251 159v110m-8-110v110m16-110v110m16-110v110m-8-110v110" stroke="#f0ecdf" stroke-width="1" opacity=".2"/>
